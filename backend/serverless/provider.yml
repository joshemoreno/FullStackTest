name: aws
runtime: nodejs20.x
region: us-east-1
stage: dev

environment:
  PRODUCTS_TABLE: ${self:service}-products-${sls:stage}
  TRANSACTIONS_TABLE: ${self:service}-transactions-${sls:stage}

iam:
  role:
    statements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:Query
          - dynamodb:Scan
        Resource:
          - !GetAtt ProductsTable.Arn
          - !GetAtt TransactionsTable.Arn
